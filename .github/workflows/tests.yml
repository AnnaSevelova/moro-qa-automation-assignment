name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request makes its older runs pointless. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  # Dependencies' install scripts don't run. Our own postinstall (installing the backend) is
  # skipped too, so the backend is installed in an explicit step.
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js with cache
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/todo-be/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js with cache
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/todo-be/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js with cache
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/todo-be/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Playwright starts the backend (apps/todo-be) on port 8080 before the API tests and stops it afterwards.
      - name: Install todo backend
        run: npm ci --prefix apps/todo-be

      - name: Run API tests
        run: npm run test:api

      # Uploaded after every run, not only on failure: the report is the record of the test results.
      - name: Publish API test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-api
          path: test-output/
          retention-days: 7
          if-no-files-found: warn

  gui:
    name: GUI tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let every browser finish, so one failing browser doesn't hide the results of the others.
      fail-fast: false
      matrix:
        project: [gui-chromium, gui-firefox, gui-webkit, gui-edge]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js with cache
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/todo-be/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Playwright starts the backend for every run (see webServer in playwright.config.ts).
      - name: Install todo backend
        run: npm ci --prefix apps/todo-be

      - name: Cache Playwright browsers
        uses: actions/cache@v6.0.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Edge is not bundled with Playwright. GitHub's runners already have it, and Playwright
      # refuses to reinstall it without --force, which also updates it to the current stable version.
      - name: Install Microsoft Edge
        if: ${{ matrix.project == 'gui-edge' }}
        run: npx playwright install --with-deps --force msedge

      - name: Run GUI tests
        run: npx playwright test --project=${{ matrix.project }} --grep-invert @live

      - name: Publish GUI test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-${{ matrix.project }}
          path: test-output/
          retention-days: 7
          if-no-files-found: warn
