name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Started manually (Actions > Tests > Run workflow) on any branch, with a choice of checks.
  # Pushes and pull requests always run everything except the visual tests.
  workflow_dispatch:
    inputs:
      lint:
        description: Lint
        type: boolean
        default: true
      typecheck:
        description: Typecheck
        type: boolean
        default: true
      api_types:
        description: API types up to date
        type: boolean
        default: true
      api_tests:
        description: API tests
        type: boolean
        default: true
      gui_tests:
        description: GUI tests
        type: boolean
        default: true
      gui_browser:
        description: Browser for the GUI tests
        type: choice
        options: [all, gui-chromium, gui-firefox, gui-webkit, gui-edge]
        default: all
      visual_tests:
        description: Visual tests (compares the live MoroSystems website)
        type: boolean
        default: false

# A newer push to a pull request makes its older runs pointless. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  # Dependencies' install scripts don't run. Our own postinstall (installing the backend) is
  # skipped too, so the backend is installed in an explicit step.
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  lint:
    name: Lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lint }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js with cache
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/todo-be/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.typecheck }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js with cache
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/todo-be/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  # The generated API types (npm run api:generate) must match what the backend currently publishes
  api-types:
    name: API types up to date
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.api_types }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js with cache
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/todo-be/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install todo backend
        run: npm ci --prefix apps/todo-be

      - name: Generate API types
        run: npm run api:generate

      - name: Check generated API types are committed
        run: |
          if ! git diff --exit-code -- tests/api/generated; then
            echo "::error::The generated API types are out of date. Run npm run api:generate and commit the result."
            exit 1
          fi

  api:
    name: API tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.api_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js with cache
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/todo-be/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Playwright starts the backend (apps/todo-be) on port 8080 before the API tests and stops it afterwards.
      - name: Install todo backend
        run: npm ci --prefix apps/todo-be

      - name: Run API tests
        run: npm run test:api

      # Uploaded after every run, not only on failure: the report is the record of the test results.
      - name: Publish API test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-api
          path: test-output/
          retention-days: 7
          if-no-files-found: warn

  gui:
    # GitHub adds the browser project to the name ("GUI tests (gui-chromium)"). Put into the name here,
    # it would show unfilled on a skipped job.
    name: GUI tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.gui_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Let every browser finish, so one failing browser doesn't hide the results of the others.
      fail-fast: false
      matrix:
        # All browsers, or only the one chosen for a manual run
        project: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.gui_browser != 'all' && format('["{0}"]', inputs.gui_browser) || '["gui-chromium", "gui-firefox", "gui-webkit", "gui-edge"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js with cache
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/todo-be/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Playwright starts the backend for every run (see webServer in playwright.config.ts).
      - name: Install todo backend
        run: npm ci --prefix apps/todo-be

      - name: Cache Playwright browsers
        uses: actions/cache@v6.0.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Edge is not bundled with Playwright. GitHub's runners already have it, and Playwright
      # refuses to reinstall it without --force, which also updates it to the current stable version.
      - name: Install Microsoft Edge
        if: ${{ matrix.project == 'gui-edge' }}
        run: npx playwright install --with-deps --force msedge

      - name: Run GUI tests
        run: npx playwright test --project=${{ matrix.project }} --grep-invert @live

      - name: Publish GUI test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-${{ matrix.project }}
          path: test-output/
          retention-days: 7
          if-no-files-found: warn

  # Only on manual runs: the visual tests compare the live MoroSystems website, which changes independently
  # of this repository, so a difference there must not block pushes and pull requests here.
  visual:
    name: Visual tests (Chromium, Firefox)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      # Only reads the Playwright version for the Docker image; dependencies are installed inside the container
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc

      - name: Check for baseline snapshots
        id: baselines
        run: |
          if find tests/visual -path '*-snapshots/linux/*' -name '*.png' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Linux baselines in tests/visual - generate them with npm run test:visual:docker:update."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Playwright version
        id: playwright
        if: ${{ steps.baselines.outputs.found == 'true' }}
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Docker image
        id: docker-cache
        if: ${{ steps.baselines.outputs.found == 'true' }}
        uses: actions/cache@v6.0.0
        with:
          path: /tmp/playwright-docker-image
          key: playwright-docker-v${{ steps.playwright.outputs.version }}-noble-amd64

      - name: Load or pull Playwright Docker image
        if: ${{ steps.baselines.outputs.found == 'true' }}
        run: |
          IMAGE="mcr.microsoft.com/playwright:v${{ steps.playwright.outputs.version }}-noble"
          CACHE_FILE="/tmp/playwright-docker-image/playwright.tar"
          if [[ -f "$CACHE_FILE" ]]; then
            docker load -i "$CACHE_FILE"
          else
            docker pull --platform linux/amd64 "$IMAGE"
            mkdir -p /tmp/playwright-docker-image
            docker save "$IMAGE" -o "$CACHE_FILE"
          fi

      - name: Run visual tests
        if: ${{ steps.baselines.outputs.found == 'true' }}
        run: npm run test:visual:docker

      # Contains the expected, actual and diff images of every failed comparison
      - name: Publish visual test report
        if: ${{ !cancelled() && steps.baselines.outputs.found == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-visual
          path: test-output/
          retention-days: 7
          if-no-files-found: warn
